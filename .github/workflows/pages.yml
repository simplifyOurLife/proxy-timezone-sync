name: 部署站点

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 收集站点文件
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 生成站点目录
        run: |
          mkdir -p dist-site
          cp docs/index.html dist-site/
          cp docs/.nojekyll dist-site/
          cp -r docs/assets dist-site/assets
          cp -r docs/images dist-site/images

      - name: 启用并读取 Pages 配置
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
